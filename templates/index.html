<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>
<body>
    <div id="title">
        <h1>To-Do List</h1>
        
        <p style="text-align: center; margin-top: -10px; margin-bottom: 20px;">
            Selamat datang, <b>{{ username }}</b>! 
        </p>

        <div style="text-align: center; margin-bottom: 20px;">
            <a href="/logout" style="padding: 5px 10px; background-color: #ff4757; color: white; text-decoration: none; border-radius: 5px; font-size: 14px;">
                Logout
            </a>
        </div>
    </div>
    
    <div id="main-container">
        <div id="task-form">
            <input type="text" placeholder="Enter task..." id="task-input" name="task" style="min-width: 50%;">
            <button type="button" id="add-btn">Add</button>
        </div>
        
        <ul id="task-list">
            <div class="task-item" data-id="5">
                <div class="task-left">
                    <div class="task-status"></div>
                    <li>item1</li>
                </div>
                <div class="task-right">
                    <button type="button" class="delete-btn">Delete</button>
                </div>   
            </div>
        </ul>
    </div>
</body>
</html>
